name: Temporary Hostinger password deployment

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the approved source
        uses: actions/checkout@v4

      - name: Package the password-management release
        run: |
          tar -czf /tmp/punit-password-release.tgz -C apps/platform \
            app/Http/Controllers/Web/AdminPanelController.php \
            app/Models/User.php \
            database/migrations/2026_07_29_000001_add_password_changed_at_to_users.php \
            resources/views/admin/account/password.blade.php \
            resources/views/admin/superadmin/admins.blade.php \
            resources/views/layouts/admin.blade.php \
            routes/web.php
          tar -tzf /tmp/punit-password-release.tgz

      - name: Back up and deploy through SSH
        env:
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$HOSTINGER_SSH_KEY" > "$HOME/.ssh/hostinger_deploy"
          chmod 600 "$HOME/.ssh/hostinger_deploy"
          cat > "$HOME/.ssh/known_hosts" <<'KNOWN_HOSTS'
          [93.127.168.78]:65002 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDTXwVy6yFVAbd/jrIKxT8+KSKX61hO7BMXGC2nh4j51
          KNOWN_HOSTS

          scp -i "$HOME/.ssh/hostinger_deploy" -P 65002 \
            /tmp/punit-password-release.tgz \
            u407989482@93.127.168.78:/home/u407989482/punit-password-release.tgz

          ssh -i "$HOME/.ssh/hostinger_deploy" -p 65002 \
            u407989482@93.127.168.78 'bash -s' <<'REMOTE'
          set -euo pipefail

          APP_DIR=/home/u407989482/domains/erp.puniterp.com/punit_erp_app
          RELEASE=/home/u407989482/punit-password-release.tgz
          PHP_BIN=/opt/alt/php84/usr/bin/php
          BACKUP_DIR="/home/u407989482/deploy_backups/password-management-$(date +%Y%m%d%H%M%S)"

          test -d "$APP_DIR"
          test -f "$APP_DIR/.env"
          test -x "$PHP_BIN"
          test -s "$RELEASE"

          mkdir -p "$BACKUP_DIR"
          tar -czf "$BACKUP_DIR/punit_erp_app.tgz" \
            -C "$(dirname "$APP_DIR")" "$(basename "$APP_DIR")"
          test -s "$BACKUP_DIR/punit_erp_app.tgz"

          tar -xzf "$RELEASE" -C "$APP_DIR"
          cd "$APP_DIR"

          "$PHP_BIN" artisan migrate --force
          "$PHP_BIN" artisan optimize:clear
          "$PHP_BIN" artisan config:cache
          "$PHP_BIN" artisan view:cache
          "$PHP_BIN" artisan route:cache
          "$PHP_BIN" artisan route:list --name=admin.account.password
          "$PHP_BIN" artisan route:list --name=admin.superadmin.admins

          rm -f "$RELEASE"
          printf 'DEPLOY_BACKUP=%s\n' "$BACKUP_DIR"
          printf 'DEPLOY_COMPLETE\n'
          REMOTE

      - name: Verify the live ERP
        run: |
          test "$(curl -sS -o /tmp/login.html -w '%{http_code}' --max-time 20 https://erp.puniterp.com/login)" = "200"
          grep -q "Punit ERP" /tmp/login.html
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://erp.puniterp.com/account/password)" = "302"
          test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://erp.puniterp.com/superadmin/admins)" = "302"
          test "$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 https://erp.puniterp.com/api/v1/health)" = "200"
          grep -q '"status"' /tmp/health.json
